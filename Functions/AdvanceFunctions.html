<html lang="en">
<head>
    <title>Advance Functions </title>

<body>
    <button id="my-button">Click me </button>
    <script>

          let behaviour= (event) => console.log("I am clicked");//Browser creates an object.That object(event) stores info about what happened

        //     type: "submit",
        //     target: "form",
        //     preventDefault: function () {
        //         console.log("Default stopped");
        //     }
        //   };
          buttonElement.addEventListener('click',behaviour);

         let printDate= () => (console.log( new Date));
         buttonElement.addEventListener('click',printDate);
