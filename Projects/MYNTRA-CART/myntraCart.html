<!DOCTYPE html>
<html lang="en">
<head>
    <title>pratice set 3</title>
    <link rel="stylesheet" href="myntracart.css">
</head>
<body>
    <button id="bag-item"    class="bag" onclick="cartquantity=cartquantity+1; document.querySelector('#cart-summary').innerText=`your bag has ${cartquantity} items`; ">Add to bag</button>
    <button id="wish-list"   onclick="cartquantity=cartquantity-1; document.querySelector('#cart-summary').innerText=`your bag has ${cartquantity} items`; ">move to WISHLIST</button>
    <button id="sale-items"  class="bag" onclick="cartquantity=cartquantity+2;document.querySelector('#cart-summary').innerText=`Your bag has ${cartquantity} items `;  ">Add 1 + 1 sale item</button>
     <h1 id="cart-summary"></h1>
    <script>
        let cartquantity=0;
        document.querySelector('#cart-summary').innerText=`Your bag has ${cartquantity} items `;
    </script>
</body>
</html>
