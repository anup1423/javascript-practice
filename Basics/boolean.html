<!DOCTYPE html>
<html lang="en">
<head>
    <title>Boolean</title>
</head>
<body>
    <script>
        console.log(3>9);
        console.log(7>2);
        console.log(2==2);
        console.log(typeof(3>6));
        console.log(typeof 'true');
        console.log(3>=5);
        //comparison opertors always give boolean output.
        console.log(5 == 5.0);
        console.log(5==5);
        console.log(5===5.0);
        console.log(5===5);
        console.log(5=='5');// == performs type conversion and then compares values
        console.log(5==='5');//===No conversion it directely match .
        console.log(5+4===3+6);//order of comparison operator is less than arithematic operator.


    </script>
</body>
</html>
