<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pratice Exercise</title>
</head>
<body>
    <script>
        function check(num){
            if(num%2===0) return `It is an Even number`;
            else return `It is not an  Even number` ;
        }
        function LargerOfTwo(x,y){
            if(x>y) return x;
            else return y;
        }
        function convert(celcius){
            let Farenheit=(9/5)*celcius+32;
            return Farenheit;
        }
        let num=12;
        console.log(check(num));
        let x=3;
        let y=5;
        console.log(LargerOfTwo(x,y));
        console.log(convert(25));

    </script>
</body>
</html>
