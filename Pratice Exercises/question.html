<!DOCTYPE html>
<html lang="en">
<head>
    <title>Question of Destructing object</title>
</head>
<body>
    <script>
        //Given an object {message: 'good job', status: 'complete'}, 
        // use de-structuring to create   two variables message and status.
        //Solution:-
        // const obj = { message: 'good job', status: 'complete' };
            let obj={message: 'good job', status: 'complete'};

            const { message, status } = obj;

            console.log(message); // good job
            console.log(status);  // complete
    </script>
</body>
</html>
